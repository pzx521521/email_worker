# 自动合并所有 Dependabot PR(含 major 升级,用户已确认)
# 仅当 CI(required status check "dependency-check")通过后才会真正合并
# 参考: https://docs.github.com/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
name: Dependabot-auto-merge

on:
  pull_request_target:

permissions:
  contents: write # 允许合并 PR
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}